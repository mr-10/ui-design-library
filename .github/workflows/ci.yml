# CI: rebuild data + run MCP tests, publish the MCP package on a version tag.
#
# - On push to main that touches uiverse/ (or the data generator), regenerate
#   the machine-readable data (data/index.min.json, data/categories.json,
#   api/*, data/featured.json, llms.txt) and commit it back if it changed.
# - On every push / pull request, run the MCP package tests.
# - On a push of a v* tag (e.g. v1.0.0), build the MCP package and publish
#   it to npm. Requires a repository secret named NPM_TOKEN (an npm
#   automation token with publish access to ui-design-library-mcp).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  data:
    name: Rebuild machine-readable data
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate data
        run: python3 scripts/generate-api-data.py
      - name: Commit regenerated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.min.json data/categories.json data/featured.json api llms.txt
          git diff --cached --quiet || git commit -m "[ci] regenerate machine-readable data"
          git push

  mcp-test:
    name: MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install and test
        working-directory: mcp
        run: |
          npm ci
          npm run build
          npm test

  mcp-publish:
    name: Publish ui-design-library-mcp to npm
    runs-on: ubuntu-latest
    needs: [mcp-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install and build
        working-directory: mcp
        run: |
          npm ci
          npm run build
      - name: Publish
        working-directory: mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
