<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluffy Bear 28</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by Codecite - Tags: button, hover, btn, hover effect */
.btn {
  border: 0 solid;
  cursor: pointer;
  font-family: system-ui;
  font-size: 100%;
  background: linear-gradient(90deg, blue, red);
  border-radius: 999px;
  font-weight: 900;
  padding: 1.8rem 5rem;
  position: relative;
  text-transform: uppercase;
}

.btn span {
  background: #1e293b;
  border-radius: 999px;
  color: #fff;
  display: grid;
  inset: 5px;
  place-items: center;
  position: absolute;
  transition: background 0.3s;
}

.btn:hover span {
  background: none;
}
</style>
</head>
<body>
<button class="btn"><span>Button</span></button>
</body>
</html>
