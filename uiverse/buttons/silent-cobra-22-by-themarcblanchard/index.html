<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silent Cobra 22</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by themarcBlanchard - Tags: button */
button {
  padding: .5rem 2rem;
  border-radius: 5px;
  font-weight: 600;
  border: 1px solid black;
}

button:hover {
  background-color: #1a5cff;
  color: white;
  transform: scale(1.1);
  font-weight: 700;
  -webkit-box-shadow: 7px 7px 23px -12px rgba(26,91,255,1);
  -moz-box-shadow: 7px 7px 23px -12px rgba(26,91,255,1);
  box-shadow: 7px 7px 23px -12px rgba(26,91,255,1);
  border: none;
}

button:active {
  background-color: #1752e5;
}
</style>
</head>
<body>
<button type="button">
  Hover
</button>
</body>
</html>
