<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lucky Eagle 6</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by JesscMendesr - Tags: transition, box-shadow */
.button {
  font-size: 1rem;
  background-color: #F2E1C1 !important;
  transform: translateY(-0.10em);
  box-shadow: 3px 3px 0px rgba(55, 22, 22, 0.67);
  border: 1px solid rgba(55, 22, 22, 0.67);
  border-radius: 50px;
  padding: 0.75em 1.5em;
  transition: 0.2s;
  cursor: pointer;
}

button:hover {
  box-shadow: 4px 6px 0px rgba(55, 22, 22, 0.67);
  transform: translateY(-0.4em);
}

button:active {
  box-shadow: none;
  transform: translateY(0);
}
</style>
</head>
<body>
<button class="button">
  Button
</button>
</body>
</html>
