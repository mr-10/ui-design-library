<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Afraid Squid 51</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by andrew-demchenk0 - Tags: animation, button, arrow, submit, confirm */
.button {
  --font-color: #323232;
  --bg-color: #fff;
  --main-color: #323232;
  width: 120px;
  height: 40px;
  border-radius: 5px;
  border: 2px solid var(--main-color);
  background-color: var(--bg-color);
  box-shadow: 4px 4px var(--main-color);
  font-size: 17px;
  font-weight: 600;
  color: var(--font-color);
  cursor: pointer;
}

.button:active {
  box-shadow: 0px 0px var(--main-color);
  transform: translate(3px, 3px);
}
</style>
</head>
<body>
<button class="button">
  Let`s go →
</button>
</body>
</html>
