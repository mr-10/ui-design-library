<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweet Vampirebat 42</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by elijahgummer  - Tags: simple, button, emoji, minimalistic, ¯\_(ツ)_/¯ */
.💀 {
  font-size: 48px;
}

.💀:after {
  content: attr(data-content);
}

.💀:hover:after {
  content: attr(data-hover-content);
}

.💀:active:after {
  content: attr(data-active-content);
}
</style>
</head>
<body>
<span
  data-active-content="🤨"
  data-hover-content="😑"
  data-content="😐"
  class="💀"
></span>
</body>
</html>
