<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Short Wasp 25</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by Rodrypaladin - Tags: simple, animation, purple, pink, button, click, css, click animation */
.button {
  margin: 0 10px;
  padding: 10px 30px;
  border: 5px solid #DF34DB;
  border-radius: 22px;
  font-size: 20px;
  color: #DF34DB;
  transition: transform 0.1s ease-in, all 0.08s ease-in;
  box-shadow: 0 5px 0 #dd04d9;
}

.button:hover {
  border-color: #ff00c8;
  box-shadow: 0 5px 0 #ff00c8;
}

.button:active {
  transform: translateY(5px);
  box-shadow: 0 0 0 #DF34DB;
}
</style>
</head>
<body>
<button class="button">
  Button
</button>
</body>
</html>
