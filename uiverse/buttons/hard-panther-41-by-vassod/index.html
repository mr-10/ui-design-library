<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hard Panther 41</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by VassoD  - Tags: minimalist, button, dark, simple button */
.button {
  cursor: pointer;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 10px 20px;
  border-radius: 0.5rem;
  transition: background 0.3s ease-in-out;
}

.button:hover {
  background: rgba(255, 255, 255, 0.25);
  text-decoration: underline;
}
</style>
</head>
<body>
<button class="button">Simple button</button>
