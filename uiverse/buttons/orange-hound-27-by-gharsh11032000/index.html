<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orange Hound 27</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by gharsh11032000 - Tags: button, shadow, hover effect */
.button {
  padding: 15px 20px;
  font-size: 16px;
  font-weight: 600;
  border: 2px solid #414141;
  color: white;
  background-color: transparent;
  cursor: pointer;
  border-radius: 10px;
  text-transform: uppercase;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
}

.button:hover {
  border-color: #0974f1;
  box-shadow: 0 0 20px rgba(9, 117, 241, 0.8);
}

.button:active {
  box-shadow: 0 0 10px rgba(9, 117, 241, 0.4);
}
</style>
</head>
<body>
<button class="button">
  Hover me
</button>
</body>
</html>
