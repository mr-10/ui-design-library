<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splendid Fish 19</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by Rudra1725  - Tags: simple, material design, 3d, button, hover, active */
.btn1 {
  color: black;
  background-color: white;
  border: solid wheat 2px;
  border-radius: 9px;
  font-size: 19px;
  padding: 12px;
  box-shadow: inset 0 0 4px black;
  font-weight: 500;
  transition: 400ms;
}
.btn1:hover {
  transition: 400ms;
  box-shadow: inset 0 0 6px black, 0 0 10px wheat;
}
.btn1:active {
  transition: 50ms;
  box-shadow: inset 0 0 0px black, 0 0 10px wheat;
}
</style>
</head>
<body>
<button class="btn1">&gt; Send Message</button>
</body>
</html>
