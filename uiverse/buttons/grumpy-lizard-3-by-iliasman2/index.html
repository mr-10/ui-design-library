<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grumpy Lizard 3</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by Iliasman2 - Tags: button */
.designer-btn {
  display: inline-block;
  padding: 14px 40px;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  border-radius: 30px;
  cursor: pointer;
  border: 2px solid black;
  transition: all 0.3s ease;
  background: linear-gradient(to bottom, #b2b5b3, #a5a7a6);
  color: rgb(57, 53, 53);
}

.designer-btn:hover {
  border: 2px solid rgb(109, 107, 107);
  color: #a5a7a6;
  box-shadow: 0 5px #666;
  transform: translateY(-5px);
  background: linear-gradient(to bottom, #2e2f2e, #323433);
}

.designer-btn:focus,
.designer-btn:active {
  transform: translateY(4px);
}
</style>
</head>
<body>
<button class="designer-btn">Click me</button>
</body>
</html>
