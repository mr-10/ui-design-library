<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lovely Bullfrog 53</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by n-jaisabai - Tags: button */
.button {
  background: radial-gradient(ellipse at top, white, blue, black, black);
  color: white;
  position: relative;
  background-size: 130% 130%;
  background-position: center center;
  padding: 15px 30px;
}

.button:hover {
  background: radial-gradient(ellipse at top, white, blue, black, black);
  animation: gradient 4s;
  animation-fill-mode: forwards;
  /* background-position: center center; */
}

.button:hover:after {
  content: "";
  position: absolute;
  inset: -.625em;
  background: radial-gradient(ellipse at top, white, blue, black, black);
  /* background-position: center center; */
  filter: blur(1.5em);
  z-index: -1;
  animation: gradient 4s;
  animation-fill-mode: forwards;
}

@keyframes gradient {
  0% {
    background-size: 130% 130%;
  }

  100% {
    background-size: 200% 200%;
  }
}
</style>
</head>
<body>
<div class="button">EXPLORE GALAXY</div>
</body>
</html>
