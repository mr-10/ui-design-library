<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stale Tiger 99</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by znvscripts  - Tags: simple, button, click effect */
button {
  position: relative;
  background: transparent;
  cursor: pointer;
  outline-offset: 4px;
  transition: filter 250ms;
  user-select: none;
  touch-action: manipulation;
  font-size: 1.1rem;
  color: white;
  box-shadow: 10px 10px 4px rgba(0, 0, 0, 0.3);
  background: rgb(255, 0, 0);
  border-radius: 12px;
  padding: 12px 27px;
  border: 3px solid black;
}

button:hover {
  filter: brightness(110%);
}

button:active {
  transform: translateY(2px);
  transition: transform 34ms;
}
</style>
</head>
<body>
<button>Button</button>
</body>
