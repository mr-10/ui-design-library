<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasty Bobcat 17</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by Remelens  - Tags: button, light, windows11 */
.button {
  display: inline-block;
  text-align: center;
  border: 0.9px solid #aaa;
  border-radius: 2.5px;
  background: #fff;
  cursor: pointer;
  color: #000;
  min-width: 80px;
  padding: 4px 0;
  margin: 0 5px;
  line-height: 20px;
  transition: all 0.2s;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  font-family: Menlo, Monaco, Consolas, "Lucida Console", "Ubuntu Mono",
    "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "SimHei";
}
.button:hover {
  border-color: #0078d4;
  background: #e0eef9;
  transition: all 0.2s;
}
.button:active {
  border-color: #005499;
  background: #cce4f7;
  transition: all 0.2s;
}
</style>
</head>
<body>
<button class="button">Button</button>
</body>
</html>
