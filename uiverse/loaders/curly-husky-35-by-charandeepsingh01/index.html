<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curly Husky 35</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by CharandeepSingh01 - Tags: loading, loader, loading animation, 3d loader */
/*View in dark mode for good effects*/
.loader {
  border: 4px solid red;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border-right-color: transparent;
  animation: rot 1s linear infinite;
  box-shadow: 0px 0px 20px red inset;
}

@keyframes rot {
  100% {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="loader"></div>
</body>
</html>
