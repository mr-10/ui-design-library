<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jolly Fireant 35</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by doniaskima - Tags: simple, neumorphism, success, loader */
.loader {
  display: inline-flex;
  gap: 10px;
}

.loader:before,
.loader:after {
  content: "";
  height: 20px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(farthest-side,#000 95%,#0000) 35% 35%/6px 6px no-repeat
    #fff;
  transform: scaleX(var(--s,1)) rotate(0deg);
  animation: l6 1s infinite linear;
}

.loader:after {
  --s: -1;
  animation-delay: -0.1s;
}

@keyframes l6 {
  100% {
    transform: scaleX(var(--s,1)) rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="loader"></div>
</body>
</html>
