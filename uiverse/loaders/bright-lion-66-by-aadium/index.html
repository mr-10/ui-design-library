<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bright Lion 66</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by aadium - Tags: loader, glow, neon */
.loader {
  width: 100px;
  height: 100px;
  background-image: #212121;
  box-shadow: 0px 5px 10px #7fe8ff, 0px -5px 10px #99ff33, 5px 0px 10px#4cffb4, -5px 0px 10px #4cffb4,
  inset 0px 5px 10px #99ff33, inset 0px -5px 10px #7fe8ff, inset 5px 0px 10px#4cffb4, inset -5px 0px 10px #4cffb4;
  border-radius: 7em;
  position: relative;
  animation: rotate 1s linear infinite;
}

@keyframes rotate {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="loader">
  <div class="cover"></div>
</div>
</body>
</html>
