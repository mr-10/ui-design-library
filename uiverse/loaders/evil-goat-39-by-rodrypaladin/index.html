<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evil Goat 39</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by Rodrypaladin - Tags: animation, red, loading, loader, modern, creative, multicolor, bounce animation */
.loader {
  width: 100px;
  height: 100px;
  background-color: orange;
  border-radius: 50%;
  box-shadow: -15px -15px 15px #ff6600, 15px -15px 15px #ff9100, 15px 15px 15px #ff5500, -15px 15px 15px #ffa600, -15px 0 15px #ff6600, 15px 0 15px #ffcc00;
  animation: rotate 1s infinite;
  transform: rotate(0) scale(0.8);
}

@keyframes rotate {
  0% {
    transform: rotate(360deg) scale(0.8);
  }

  50% {
    transform: rotate(0) scale(1.2);
  }
}
</style>
</head>
<body>
<div class="loader"></div>
</body>
</html>
