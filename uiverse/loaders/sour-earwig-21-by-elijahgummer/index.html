<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sour Earwig 21</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by elijahgummer  - Tags: simple, animation, green, loader, smooth, modern, animated, css */
.container {
  width: 50px;
  height: 50px;
}

.container .boxes {
  width: 50px;
  height: 50px;
  fill: none;
  stroke-width: 50px;
  stroke: #43cb85;
  stroke-dasharray: 50;
  stroke-dashoffset: 50%;
  animation: animate 2s linear infinite;
}

@keyframes animate {
  to {
    stroke-dashoffset: 250%;
  }
}
</style>
</head>
<body>
<svg class="container"><rect class="boxes"></rect></svg>
</body>
</html>
