<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Massive Newt 28</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by mrhyddenn - Tags: loader, spinner */
.loader {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid rgb(255,255,255,.2);
  border-top-color: transparent;
  animation: rot1 1.2s linear infinite;
}

@keyframes rot1 {
  to {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="loader"></div>
</body>
</html>
