<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hungry Cougar 91</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by sonex-ICB  - Tags: simple, animation, loader, rotate, animated, creative, spin, loading animation */
.loader {
  border: 10px inset tomato;
  padding: 12px;
  transform: rotate(45deg);
  animation: loader1 1s ease-in-out infinite;
}
@keyframes loader1 {
  0% {
    opacity: 0;
  }
  50% {
    opacity: 1;
    transform: scale(1.5);
  }
  100% {
    opacity: 0;
  }
}
</style>
</head>
<body>
<div class="loader"></div>
</body>
</html>
