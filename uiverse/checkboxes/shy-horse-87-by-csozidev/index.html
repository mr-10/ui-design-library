<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shy Horse 87</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by csozidev - Tags: checkbox */
/* Green glow checkbox made by: csozi | Website: www.csozi.hu*/

.container input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.container {
  display: block;
  position: relative;
  cursor: pointer;
  font-size: 20px;
  user-select: none;
  background-color: #676767;
  padding: 4px;
  border-radius: 25px;
}

.checkmark {
  position: relative;
  top: 0;
  left: 0;
  height: 1.3em;
  width: 1.3em;
  border-radius: 1rem;
  background-color: #004000;
  transition: 0.1s;
}

.container input:checked ~ .checkmark {
  background-color: #00de00;
  box-shadow: 0 0 10px #00ff00;
}
</style>
</head>
<body>
<label class="container">
  <input type="checkbox" checked="checked">
  <div class="checkmark"></div>
</label>
</body>
</html>
