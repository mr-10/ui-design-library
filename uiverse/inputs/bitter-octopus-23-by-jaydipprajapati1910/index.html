<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bitter Octopus 23</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by JaydipPrajapati1910 - Tags: neumorphism, input */
.input {
  max-width: 190px;
  border: none;
  outline: none;
  background: none;
  font-size: 18px;
  color: #555;
  padding: 15px 5px 10px 20px;
  box-shadow: inset 8px 8px 8px #cbced1,
              inset -8px -8px 8px #ffffff;
  border-radius: 25px;
}

.input::placeholder {
  color: #555;
  transition: all 0.3s ease;
}

.input:focus::placeholder {
  color: #999;
}
</style>
</head>
<body>
<input placeholder="Username" type="text" name="text" class="input">
</body>
</html>
