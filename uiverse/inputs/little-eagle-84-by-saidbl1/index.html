<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Eagle 84</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by saidbl1 - Tags: input, modern, animated, clean */
.input {
  height: 40px;
  border-radius: 8px;
  border: 2px solid hsl(236, 92%, 66%);
  outline: none;
  transition: 200ms ease-in;
  padding-left: 1rem;
}

.input:focus {
  border-bottom: 4px solid hsl(236, 92%, 66%);
  padding-top: 2px;
}

.input::placeholder {
  color: hsl(236, 92%, 66%);
  opacity: 0.5;
}
</style>
</head>
<body>
<input class="input" name="text" type="text" placeholder="Full Name">
</body>
