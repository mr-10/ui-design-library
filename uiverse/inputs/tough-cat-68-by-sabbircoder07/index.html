<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tough Cat 68</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by sabbircoder07 - Tags: email, input, box-shadow */
.input__email {
  width: 100%;
  padding: 10px 18px;
  font-size: 14px;
  font-family: inherit;
  box-shadow: 0 0 0 1px #ffe3e3;
  border: none;
  border-radius: 20px;
  background-color: #fff5f5;
}

.input__email::placeholder {
  color: #ce9797;
  font-size: 12px;
}

.input__email:focus {
  outline: none;
  box-shadow: 0 0 0 1px #ffe3e3;
  border: none;
}
</style>
</head>
<body>
<input type="text" id="email-id" name="text" class="input__email" placeholder="Email Address">
