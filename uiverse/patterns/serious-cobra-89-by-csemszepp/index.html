<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serious Cobra 89</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by csemszepp  - Tags: simple, minimalist, pattern */
.container {
  width: 100%;
  height: 100%;
  --s: 100px; /* control the size */

  --_g: #0000 90deg, #366 0;
  background: conic-gradient(from 90deg at 2px 2px, var(--_g)),
    conic-gradient(from 90deg at 1px 1px, var(--_g));
  background-size: var(--s) var(--s), calc(var(--s) / 5) calc(var(--s) / 5);
}
</style>
</head>
<body>
<div class="container"></div>
</body>
</html>
