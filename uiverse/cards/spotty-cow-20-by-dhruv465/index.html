<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotty Cow 20</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by dhruv465 - Tags: animated, spin, loader circle */
.one-div {
  width: 40px;
  height: 40px;
  border: 8px solid #fff;
  border-top-color: #8c8eff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }

  100% {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="one-div"></div>
</body>
</html>
