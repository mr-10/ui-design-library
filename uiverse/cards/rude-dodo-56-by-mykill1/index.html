<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rude Dodo 56</title>
<style>
body { display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
</style>
<style>
/* From Uiverse.io by mykill1 - Tags: card */
.card {
  width: 190px;
  height: 254px;
  border-radius: 10px;
  background: #ae3737;
  overflow: hidden;
  box-shadow: inset 27px 27px 54px #7a2727, inset -27px -27px 54px #e24848;
}

.content {
  width: 160px;
  height: 220px;
  position: relative;
  margin-top: 16px;
  margin-left: 15px;
  border: none;
  border-radius: 10px;
  background: #ae3737;
  background: linear-gradient(45deg, #9d3232, #ba3b3b);
  box-shadow: 27px -27px 54px #7a2727,
             -27px 27px 54px #e24848;
}

content :hover {
  border: 1px solid #7a2727;
}

.card :hover {
  border: 1px solid #7a2727;
}
</style>
</head>
<body>
<div class="card">
    <div class="content"></div>
</div>
</body>
</html>
